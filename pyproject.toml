[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fidoinv"
version = "0.1.0"
description = "Inventory FIDO2 security keys: device info, passkeys (resident credentials), optional TOTP account names"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["fido2>=2.0,<3"]

[project.optional-dependencies]
yubikey = ["yubikey-manager>=5"]
onlykey = ["onlykey"]
test = ["pytest"]

[project.scripts]
fidoinv = "fidoinv.cli:main"

[tool.setuptools]
packages = ["fidoinv"]

[tool.setuptools.package-data]
fidoinv = ["aaguids.json"]
